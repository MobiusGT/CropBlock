<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Four mathematically symmetrical warm wooden-colored crop brackets
       Outer bounds: x=[60..964] (904px), y=[176..848] (672px), center=(512,512)
       Arm thickness=60px, horizontal length=264px, vertical length=228px -->
  <g fill="#A46222">
    <!-- Top-Left -->
    <path d="M60 176 H324 V236 H120 V404 H60 Z"/>
    <!-- Top-Right (exact horizontal mirror: x -> 1024 - x) -->
    <path d="M964 176 H700 V236 H904 V404 H964 Z"/>
    <!-- Bottom-Left (exact vertical mirror: y -> 1024 - y) -->
    <path d="M60 848 H324 V788 H120 V620 H60 Z"/>
    <!-- Bottom-Right (exact horizontal + vertical mirror) -->
    <path d="M964 848 H700 V788 H904 V620 H964 Z"/>
  </g>
</svg>
